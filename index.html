    desc:'白天潜水捕鱼、晚上开寿司店的治愈经营。', license:'付费游戏' },

    desc:'可调频的海洋声景,助眠/专注神器。', license:'免费' },

    desc:'海洋氛围 BGM,免费可商用。', license:'免费商用' },

const CATS = {
  image: { label:'图片素材' },
  wallpaper: { label:'壁纸 / 背景' },
  video: { label:'视频素材' },
  audio: { label:'BGM / 音乐' },
  game:  { label:'游戏素材' },
  ui:    { label:'UI 设计参考' },
  book:  { label:'电子书 / 图书馆' },
  icon:  { label:'图标素材' },
  font:  { label:'字体下载' },
  tool:  { label:'设计工具' },
  edit:  { label:'剪辑 / 转场动效' },
  skill: { label:'Skill 技能' },
  mcp:   { label:'MCP 合集' },
  prompt: { label:'提示词库 / Prompt' },
  aitool: { label:'AI 工具站' },
  voice:  { label:'语音 / AI 配音' },
  noise:  { label:'白噪音 / 助眠' },
  direct: { label:'音乐直链' },
  pixel:  { label:'像素素材' },
  texture:  { label:'贴图 / 纹理' },
  motion:   { label:'动态素材' },
  character:{ label:'游戏角色' },
  anime:    { label:'动漫立绘' },
  edu:      { label:'教育 / 备课' },
  ocean:    { label:'海洋专题' },
};

const main = document.getElementById('main');
const chipsEl = document.getElementById('chips');
const searchEl = document.getElementById('search');
const clearSearch = document.getElementById('clearSearch');
const sortSel = document.getElementById('sortSel');
const statsEl = document.getElementById('stats');
const toTop = document.getElementById('toTop');
const exportBtn = document.getElementById('exportBtn');
const importBtn = document.getElementById('importBtn');
const importFile = document.getElementById('importFile');
let currentCat = 'all';
let keyword = '';
let onlyFav = false;
let sortMode = 'default';

/* 收藏与备注(存在浏览器 localStorage 里) */
const KEY_FAV = 'asset-nav-favs';
const KEY_NOTE = 'asset-nav-notes';
function loadSet(k){ try { return new Set(JSON.parse(localStorage.getItem(k)) || []); } catch(e){ return new Set(); } }
function loadObj(k){ try { return JSON.parse(localStorage.getItem(k)) || {}; } catch(e){ return {}; } }
let favs = loadSet(KEY_FAV);
let notes = loadObj(KEY_NOTE);
function persistFavs(){ try { localStorage.setItem(KEY_FAV, JSON.stringify([...favs])); } catch(e){} }
function persistNotes(){ try { localStorage.setItem(KEY_NOTE, JSON.stringify(notes)); } catch(e){} }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function renderChips() {
  const counts = { all: SITES.length };
  Object.keys(CATS).forEach(c => counts[c] = SITES.filter(s => s.cat === c).length);
  const order = ['all', 'image', 'wallpaper', 'video', 'audio', 'game', 'texture', 'motion', 'character', 'anime', 'ui', 'icon', 'font', 'tool', 'edit', 'book', 'edu', 'skill', 'mcp', 'prompt', 'aitool', 'voice', 'noise', 'direct', 'pixel', 'ocean'];
  const catChips = order.map(c =>
    `<button class="chip ${c === currentCat && !onlyFav ? 'active' : ''}" data-cat="${c}">
      ${c === 'all' ? '全部' : CATS[c].label}
      <span class="count">${counts[c]}</span>
    </button>`
  ).join('');
  const favChip = `<button class="chip ${onlyFav ? 'active' : ''}" data-cat="__fav">
    收藏<span class="count">${favs.size}</span>
  </button>`;
  chipsEl.innerHTML = catChips + favChip;
}

function filtered() {
  const kw = keyword.trim().toLowerCase();
  let list = SITES.filter(s => {
    if (currentCat !== 'all' && s.cat !== currentCat) return false;
    if (onlyFav && !favs.has(s.url)) return false;
    if (!kw) return true;
    return (s.name + s.desc + s.license + (notes[s.url] || '')).toLowerCase().includes(kw);
  });
  if (sortMode === 'name') list = [...list].sort((a, b) => a.name.localeCompare(b.name, 'zh'));
  return list;
}

function render() {
  const list = filtered();
  statsEl.innerHTML = `共 <b>${SITES.length}</b> 个站点 · 当前显示 <b>${list.length}</b> 个 · 已收藏 <b>${favs.size}</b> 个`;
  if (!list.length) {
    main.innerHTML = `<div class="empty">没有找到匹配的网站,换个关键词试试</div>`;
    return;
  }
  const grouped = {};
  list.forEach(s => { (grouped[s.cat] = grouped[s.cat] || []).push(s); });

  main.innerHTML = Object.entries(grouped).map(([cat, arr]) => `
    <div class="section-title">
      <span class="bar"></span>${CATS[cat].label}<span class="num">(${arr.length})</span>
    </div>
    <div class="grid">
      ${arr.map((s, i) => `
        <div class="card" style="--d:${Math.min(i * 30, 240)}ms">
          <div class="card-top">
            
            <div class="card-name">
              <a href="${s.url}" target="_blank" rel="noopener">${s.name}</a>
            </div>
            ${s.hot ? '<span class="badge hot-badge">推荐</span>' : ''}
            <button class="star-btn ${favs.has(s.url) ? 'on' : ''}" data-url="${s.url}" title="收藏/取消收藏">${favs.has(s.url) ? '★' : '☆'}</button>
          </div>
          <div class="card-desc">${s.desc}</div>
          ${notes[s.url] ? `<div class="card-note">${escapeHtml(notes[s.url])}</div>` : ''}
          <div class="card-meta">
            <span class="badge ${s.license.includes('署名') ? 'warn' : ''}">${s.license}</span>
            <button class="note-btn ${notes[s.url] ? 'has-note' : ''}" data-note="${s.url}">备注</button>
            <a class="visit" href="${s.url}" target="_blank" rel="noopener">前往 →</a>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

chipsEl.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  if (chip.dataset.cat === '__fav') {
    onlyFav = !onlyFav;
    if (onlyFav) currentCat = 'all';
  } else {
    currentCat = chip.dataset.cat;
    onlyFav = false;
  }
  renderChips(); render();
});
main.addEventListener('click', e => {
  const star = e.target.closest('.star-btn');
  if (star) {
    const url = star.dataset.url;
    if (favs.has(url)) favs.delete(url); else favs.add(url);
    persistFavs();
    renderChips(); render();
    return;
  }
  const nb = e.target.closest('.note-btn');
  if (nb) {
    const url = nb.dataset.note;
    const cur = notes[url] || '';
    const val = prompt('给这个网站写个备注(清空即删除):', cur);
    if (val === null) return;
    if (val.trim() === '') delete notes[url]; else notes[url] = val.trim();
    persistNotes();
    render();
  }
});
searchEl.addEventListener('input', e => {
  keyword = e.target.value;
  clearSearch.classList.toggle('show', !!keyword);
  render();
});
clearSearch.addEventListener('click', () => {
  searchEl.value = ''; keyword = '';
  clearSearch.classList.remove('show');
  render(); searchEl.focus();
});
sortSel.addEventListener('change', e => { sortMode = e.target.value; render(); });

/* 返回顶部 */
window.addEventListener('scroll', () => toTop.classList.toggle('show', window.scrollY > 400));
toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

/* 键盘快捷键:/ 聚焦搜索,Esc 清空 */
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchEl) {
    e.preventDefault(); searchEl.focus();
  } else if (e.key === 'Escape' && document.activeElement === searchEl) {
    searchEl.value = ''; keyword = '';
    clearSearch.classList.remove('show');
    render(); searchEl.blur();
  }
});

/* 导出 / 导入收藏与备注 */
exportBtn.addEventListener('click', () => {
  const data = { exportedAt: new Date().toISOString(), favs: [...favs], notes };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Codyhome-收藏备份.json';
  a.click();
  URL.revokeObjectURL(a.href);
});
importBtn.addEventListener('click', () => importFile.click());
importFile.addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      const valid = u => SITES.some(s => s.url === u);
      if (Array.isArray(d.favs)) d.favs.filter(valid).forEach(u => favs.add(u));
      if (d.notes && typeof d.notes === 'object') {
        Object.keys(d.notes).forEach(u => { if (valid(u)) notes[u] = d.notes[u]; });
      }
      persistFavs(); persistNotes();
      renderChips(); render();
      alert('✅ 导入成功(已合并进当前收藏/备注)');
    } catch (err) {
      alert('❌ 导入失败:文件格式不正确');
    }
  };
  r.readAsText(f);
  e.target.value = '';
});

document.getElementById('heroTotal').textContent = SITES.length;
renderChips(); render();
</script>
</body>
</html>
